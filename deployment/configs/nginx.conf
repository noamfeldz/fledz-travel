server {
    listen 80;
    listen [::]:80;
    server_name travel.blox.co.il;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name travel.blox.co.il;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/travel.blox.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel.blox.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fledz-travel;
    index index.html;

    access_log /var/log/nginx/fledz-travel-access.log;
    error_log /var/log/nginx/fledz-travel-error.log;

    # API proxy to backend
    location /api/ {
        client_max_body_size 10m;

        proxy_pass http://localhost:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
